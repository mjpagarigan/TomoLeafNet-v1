<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; font-family: 'DM Sans', sans-serif;
}
::-webkit-scrollbar { display: none; }

/* Tweaks panel */
#tweaks-panel {
  display: none;
  position: fixed; bottom: 24px; right: 24px;
  background: rgba(20,20,20,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 20px;
  z-index: 9999; width: 240px;
  backdrop-filter: blur(20px);
  color: #fff; font-family: 'DM Sans', sans-serif;
}
#tweaks-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: #fff; }
#tweaks-panel label { font-size: 12px; color: rgba(255,255,255,0.5); display: block; margin-bottom: 4px; }
#tweaks-panel select, #tweaks-panel input[type=range] {
  width: 100%; margin-bottom: 14px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; padding: 6px 10px; font-size: 13px;
}
</style>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Design tokens ───────────────────────────────────────────
const T = {
  bg:       'oklch(9% 0.025 155)',
  surface:  'oklch(14% 0.03 155)',
  surfaceUp:'oklch(19% 0.035 155)',
  border:   'rgba(255,255,255,0.07)',
  green:    'oklch(65% 0.2 145)',
  greenDim: 'oklch(35% 0.12 145)',
  greenGlow:'oklch(65% 0.2 145)',
  amber:    'oklch(72% 0.16 85)',
  red:      'oklch(62% 0.22 22)',
  text:     'oklch(96% 0.01 155)',
  textSub:  'oklch(62% 0.025 155)',
  textMuted:'oklch(42% 0.02 155)',
};

// ─── Shared micro-components ─────────────────────────────────
const Chip = ({children, color='green', small=false}) => {
  const bg = color==='green' ? 'rgba(60,180,90,0.15)' : color==='red' ? 'rgba(220,70,70,0.15)' : color==='amber' ? 'rgba(210,155,60,0.15)' : 'rgba(255,255,255,0.08)';
  const tc = color==='green' ? T.green : color==='red' ? T.red : color==='amber' ? T.amber : T.textSub;
  return <span style={{background:bg,color:tc,borderRadius:99,padding:small?'2px 8px':'4px 10px',fontSize:small?10:11,fontWeight:600,letterSpacing:0.3,border:`1px solid ${tc}22`}}>{children}</span>;
};

const Divider = () => <div style={{height:1,background:T.border,margin:'0 20px'}}/>;

// ─── Bottom Tab Bar ───────────────────────────────────────────
const TABS = [
  {id:'home', label:'Home', icon:(a)=>(
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M3 12L12 4l9 8" stroke={a?T.green:'rgba(255,255,255,0.35)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M5 10v9a1 1 0 001 1h4v-4h4v4h4a1 1 0 001-1v-9" stroke={a?T.green:'rgba(255,255,255,0.35)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  )},
  {id:'chat', label:'Tomo AI', icon:(a)=>(
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 3C7.03 3 3 6.58 3 11c0 1.98.78 3.78 2.07 5.18L4 21l5.15-1.54A9.2 9.2 0 0012 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z" stroke={a?T.green:'rgba(255,255,255,0.35)'} strokeWidth="2" strokeLinejoin="round" fill={a?'rgba(60,180,90,0.1)':'none'}/>
    </svg>
  )},
  {id:'history', label:'My Plants', icon:(a)=>(
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C9 2 6 5 6 8c0 4 3 6 6 10 3-4 6-6 6-10 0-3-3-6-6-6z" stroke={a?T.green:'rgba(255,255,255,0.35)'} strokeWidth="2" strokeLinejoin="round" fill={a?'rgba(60,180,90,0.1)':'none'}/>
    </svg>
  )},
  {id:'more', label:'More', icon:(a)=>(
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="5" r="1.5" fill={a?T.green:'rgba(255,255,255,0.35)'}/>
      <circle cx="12" cy="12" r="1.5" fill={a?T.green:'rgba(255,255,255,0.35)'}/>
      <circle cx="12" cy="19" r="1.5" fill={a?T.green:'rgba(255,255,255,0.35)'}/>
    </svg>
  )},
];

function TabBar({active, onTab, onScan}) {
  return (
    <div style={{position:'absolute',bottom:0,left:0,right:0,height:88,zIndex:100}}>
      <div style={{
        position:'absolute',inset:0,
        background:'rgba(10,14,12,0.85)',
        backdropFilter:'blur(20px)',
        borderTop:'1px solid rgba(255,255,255,0.06)',
      }}/>
      <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'space-around',height:60,paddingTop:4}}>
        {TABS.slice(0,2).map(t=>(
          <button key={t.id} onClick={()=>onTab(t.id)} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'8px 16px'}}>
            {t.icon(active===t.id)}
            <span style={{fontSize:10,color:active===t.id?T.green:'rgba(255,255,255,0.35)',fontWeight:active===t.id?600:400,fontFamily:'DM Sans'}}>{t.label}</span>
          </button>
        ))}
        {/* FAB */}
        <button onClick={onScan} style={{
          width:58,height:58,borderRadius:99,border:'none',cursor:'pointer',
          background:`linear-gradient(135deg, oklch(68% 0.22 145), oklch(55% 0.2 155))`,
          boxShadow:`0 4px 20px oklch(65% 0.2 145 / 0.4)`,
          display:'flex',alignItems:'center',justifyContent:'center',
          transform:'translateY(-12px)',
          flexShrink:0,
        }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="white" strokeWidth="2"/>
            <path d="M8 11h6M11 8v6" stroke="white" strokeWidth="2.5" strokeLinecap="round"/>
          </svg>
        </button>
        {TABS.slice(2).map(t=>(
          <button key={t.id} onClick={()=>onTab(t.id)} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'8px 16px'}}>
            {t.icon(active===t.id)}
            <span style={{fontSize:10,color:active===t.id?T.green:'rgba(255,255,255,0.35)',fontWeight:active===t.id?600:400,fontFamily:'DM Sans'}}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Screen: Home ─────────────────────────────────────────────
function HomeScreen({onNav}) {
  return (
    <div style={{background:T.bg,minHeight:'100%',paddingBottom:100,fontFamily:'DM Sans'}}>
      {/* Header */}
      <div style={{padding:'72px 20px 20px',background:`linear-gradient(180deg, oklch(12% 0.04 155) 0%, ${T.bg} 100%)`}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,borderRadius:99,background:`linear-gradient(135deg,oklch(35% 0.1 155),oklch(22% 0.06 155))`,border:'1.5px solid rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:16}}>🌿</span>
            </div>
            <div>
              <div style={{fontSize:12,color:T.textMuted,fontWeight:400}}>Good morning</div>
              <div style={{fontSize:16,color:T.text,fontWeight:700,lineHeight:1.2}}>MJ</div>
            </div>
          </div>
          <button style={{background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:12,width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke={T.textSub} strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>

        {/* Search */}
        <div style={{marginTop:18,background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:14,display:'flex',alignItems:'center',gap:10,padding:'11px 16px'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke={T.textMuted} strokeWidth="2"/><path d="M21 21l-4.35-4.35" stroke={T.textMuted} strokeWidth="2" strokeLinecap="round"/></svg>
          <span style={{fontSize:14,color:T.textMuted}}>Search scan history…</span>
        </div>
      </div>

      {/* Weather pill */}
      <div style={{padding:'0 20px 20px'}}>
        <div style={{background:T.surface,borderRadius:16,padding:'12px 16px',display:'flex',alignItems:'center',gap:12,border:`1px solid ${T.border}`}}>
          <span style={{fontSize:22}}>☀️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,color:T.text,fontWeight:600}}>Sunny, 78°F — Good scanning conditions</div>
            <div style={{fontSize:11,color:T.textMuted}}>Low humidity · Bright light</div>
          </div>
          <Chip small>Now</Chip>
        </div>
      </div>

      {/* Scanning section */}
      <div style={{padding:'0 20px'}}>
        <div style={{fontSize:12,color:T.textMuted,fontWeight:600,letterSpacing:1,textTransform:'uppercase',marginBottom:14}}>Scan Your Plant</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {/* Identify card */}
          <button onClick={()=>onNav('camera','identify')} style={{
            borderRadius:20,overflow:'hidden',border:'none',cursor:'pointer',
            background:`linear-gradient(155deg, oklch(22% 0.08 145) 0%, oklch(14% 0.04 155) 100%)`,
            border:'1px solid rgba(60,180,90,0.2)',
            padding:'18px 16px 14px',
            display:'flex',flexDirection:'column',gap:4,alignItems:'flex-start',
            position:'relative',
          }}>
            <div style={{position:'absolute',top:0,right:0,width:80,height:80,borderRadius:'0 20px 0 60px',background:'rgba(60,180,90,0.07)'}}/>
            <div style={{fontSize:11,color:T.green,fontWeight:600,letterSpacing:0.5,textTransform:'uppercase'}}>Identify</div>
            <div style={{fontSize:22,fontWeight:800,color:T.text,lineHeight:1.2,textAlign:'left'}}>Recognize any leaf</div>
            <div style={{marginTop:8,width:32,height:32,borderRadius:99,background:T.green,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          </button>

          {/* Diagnose card */}
          <button onClick={()=>onNav('camera','diagnose')} style={{
            borderRadius:20,overflow:'hidden',border:'none',cursor:'pointer',
            background:`linear-gradient(155deg, oklch(20% 0.06 50) 0%, oklch(14% 0.04 155) 100%)`,
            border:'1px solid rgba(210,155,60,0.2)',
            padding:'18px 16px 14px',
            display:'flex',flexDirection:'column',gap:4,alignItems:'flex-start',
            position:'relative',
          }}>
            <div style={{position:'absolute',top:0,right:0,width:80,height:80,borderRadius:'0 20px 0 60px',background:'rgba(210,155,60,0.07)'}}/>
            <div style={{fontSize:11,color:T.amber,fontWeight:600,letterSpacing:0.5,textTransform:'uppercase'}}>Diagnose</div>
            <div style={{fontSize:22,fontWeight:800,color:T.text,lineHeight:1.2,textAlign:'left'}}>Check plant health</div>
            <div style={{marginTop:8,width:32,height:32,borderRadius:99,background:T.amber,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          </button>
        </div>
      </div>

      {/* Quick stats */}
      <div style={{padding:'20px 20px 0'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {[['12','Scans'],['8','Healthy'],['4','Infected']].map(([n,l])=>(
            <div key={l} style={{background:T.surface,borderRadius:14,padding:'14px 12px',textAlign:'center',border:`1px solid ${T.border}`}}>
              <div style={{fontSize:24,fontWeight:800,color:T.text}}>{n}</div>
              <div style={{fontSize:11,color:T.textMuted,marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
      </div>

}

// ─── Screen: Chat ─────────────────────────────────────────────
function ChatScreen() {
  const suggestions=['Why are my tomato leaves showing white trails?','How do I treat Early Blight?','What does Leaf Mold look like?','My confidence score was low — should I worry?'];
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [started,setStarted]=useState(false);

  const send=(text)=>{
    if(!text.trim()) return;
    const q=text.trim();
    setMsgs(m=>[...m,{role:'user',text:q}]);
    setInput('');
    setStarted(true);
    setLoading(true);
    window.claude.complete(`You are Tomo, a plant health AI assistant specializing in tomato diseases. Answer concisely and helpfully in 2-3 sentences. Question: ${q}`)
      .then(r=>{setMsgs(m=>[...m,{role:'ai',text:r}]);setLoading(false);})
      .catch(()=>{setMsgs(m=>[...m,{role:'ai',text:'Sorry, I had trouble answering that. Please try again.'}]);setLoading(false);});
  };

  return (
    <div style={{background:T.bg,height:'100%',display:'flex',flexDirection:'column',fontFamily:'DM Sans'}}>
      {/* Header */}
      <div style={{padding:'68px 20px 16px',background:`linear-gradient(180deg,oklch(12% 0.04 155),${T.bg})`,flexShrink:0}}>
        <div style={{fontSize:20,fontWeight:800,color:T.text}}>Tomo <span style={{fontSize:18}}>🌿</span></div>
        <div style={{fontSize:13,color:T.textMuted}}>Plant Health Assistant</div>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'0 16px'}}>
        {!started&&(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'20px 0 24px',gap:16}}>
            <div style={{width:64,height:64,borderRadius:99,background:`linear-gradient(135deg,oklch(35% 0.12 145),oklch(25% 0.08 155))`,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 0 30px oklch(65% 0.2 145 / 0.2)`}}>
              <span style={{fontSize:28}}>🌿</span>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:18,fontWeight:800,color:T.text}}>Hi! I'm Tomo 🌱</div>
              <div style={{fontSize:13,color:T.textMuted,marginTop:4,lineHeight:1.5,maxWidth:240}}>Ask me anything about your tomato plants, recent scans, or how to treat leaf diseases.</div>
            </div>
            <div style={{width:'100%'}}>
              <div style={{fontSize:11,color:T.textMuted,marginBottom:8,textAlign:'center',letterSpacing:0.5}}>SUGGESTED QUESTIONS</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {suggestions.map(s=>(
                  <button key={s} onClick={()=>send(s)} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:'12px 16px',cursor:'pointer',textAlign:'left',fontSize:13,color:T.textSub,fontFamily:'DM Sans',lineHeight:1.4}}>
                    {s}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:10}}>
            {m.role==='ai'&&<div style={{width:28,height:28,borderRadius:99,background:`linear-gradient(135deg,oklch(35% 0.12 145),oklch(25% 0.08 155))`,display:'flex',alignItems:'center',justifyContent:'center',marginRight:8,flexShrink:0,marginTop:4}}>
              <span style={{fontSize:13}}>🌿</span>
            </div>}
            <div style={{maxWidth:'75%',padding:'12px 16px',borderRadius:m.role==='user'?'18px 18px 4px 18px':'18px 18px 18px 4px',background:m.role==='user'?T.green:T.surface,border:m.role==='ai'?`1px solid ${T.border}`:'none'}}>
              <div style={{fontSize:14,color:m.role==='user'?'white':T.text,lineHeight:1.5}}>{m.text}</div>
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <div style={{width:28,height:28,borderRadius:99,background:`linear-gradient(135deg,oklch(35% 0.12 145),oklch(25% 0.08 155))`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:13}}>🌿</span>
            </div>
            <div style={{background:T.surface,borderRadius:'18px 18px 18px 4px',padding:'12px 16px',border:`1px solid ${T.border}`}}>
              <div style={{display:'flex',gap:4}}>
                {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:99,background:T.textMuted,animation:`pulse 1.2s ease ${i*0.2}s infinite`}}/>)}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Input */}
      <div style={{padding:'12px 16px 20px',flexShrink:0,background:T.bg,borderTop:`1px solid ${T.border}`}}>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <div style={{flex:1,background:T.surface,borderRadius:14,border:`1px solid ${T.border}`,display:'flex',alignItems:'center',padding:'2px 4px 2px 16px',gap:8}}>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(input)} placeholder="Type your question…" style={{flex:1,background:'none',border:'none',outline:'none',color:T.text,fontSize:14,fontFamily:'DM Sans',padding:'10px 0'}}/>
          </div>
          <button onClick={()=>send(input)} style={{width:44,height:44,borderRadius:12,border:'none',cursor:'pointer',background:T.green,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 2px 12px oklch(65% 0.2 145 / 0.35)`}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState('home');
  const [screen,setScreen]=useState('home'); // current full screen
  const [cameraMode,setCameraMode]=useState('identify');
  const [showScanModal,setShowScanModal]=useState(false);
  const [tweaksVisible,setTweaksVisible]=useState(false);

  const navigate=(to,mode)=>{
    if(mode) setCameraMode(mode);
    setScreen(to);
  };

  // Tweaks protocol
  useEffect(()=>{
    const handler=({data})=>{
      if(data?.type==='__activate_edit_mode') setTweaksVisible(true);
      if(data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  const renderScreen=()=>{
    if(screen==='camera') return <CameraScreen mode={cameraMode} onBack={()=>setScreen('home')} onResult={(m)=>navigate(m==='identify'?'identify':'diagnosis')}/>;
    if(screen==='identify') return <IdentifyResultsScreen onBack={()=>setScreen('camera')} onDiagnose={()=>setScreen('diagnosis')}/>;
    if(screen==='diagnosis') return <DiagnosisScreen onBack={()=>setScreen('identify')}/>;
    if(tab==='home') return <HomeScreen onNav={navigate}/>;
    if(tab==='chat') return <ChatScreen/>;
    if(tab==='history') return <HistoryScreen onViewResult={()=>setScreen('identify')}/>;
    if(tab==='more') return <MoreScreen/>;
  };

  const showTabBar = !['camera'].includes(screen);
  const isSubScreen = ['identify','diagnosis'].includes(screen);

  return (
    <>
      <IOSDevice width={390} height={844} dark={true}>
        <div style={{height:'100%',position:'relative',overflow:'hidden'}}>
          <div style={{height:'100%',overflowY:'hidden'}}>
            {renderScreen()}
          </div>
          {showTabBar&&!isSubScreen&&(
            <TabBar
              active={tab}
              onTab={t=>{setTab(t);setScreen('home_equiv');}}
              onScan={()=>setShowScanModal(true)}
            />
          )}
        </div>
      </IOSDevice>

      {showScanModal&&<ScanModal onClose={()=>setShowScanModal(false)} onChoose={mode=>{navigate('camera',mode);}}/>}

      {/* Tweaks panel */}
      <div id="tweaks-panel" style={{display:tweaksVisible?'block':'none',position:'fixed',bottom:24,right:24,background:'rgba(14,20,16,0.97)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:20,padding:20,zIndex:9999,width:240,backdropFilter:'blur(20px)',color:'#fff',fontFamily:'DM Sans'}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:16,color:T.text}}>Tweaks</div>
        <div style={{fontSize:12,color:T.textMuted,marginBottom:6}}>Active Screen</div>
        <select onChange={e=>setScreen(e.target.value)} value={screen} style={{width:'100%',marginBottom:14,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'#fff',padding:'6px 10px',fontSize:13,fontFamily:'DM Sans'}}>
          <option value="home_equiv">Home</option>
          <option value="camera">Camera</option>
          <option value="identify">Identify Results</option>
          <option value="diagnosis">Diagnosis</option>
        </select>
        <div style={{fontSize:12,color:T.textMuted,marginBottom:6}}>Camera Mode</div>
        <select onChange={e=>setCameraMode(e.target.value)} value={cameraMode} style={{width:'100%',marginBottom:14,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'#fff',padding:'6px 10px',fontSize:13,fontFamily:'DM Sans'}}>
          <option value="identify">Identify</option>
          <option value="diagnose">Diagnose</option>
        </select>
      </div>

      <style>{`
        @keyframes pulse {
          0%,100%{opacity:0.3;transform:scale(0.8)}
          50%{opacity:1;transform:scale(1.1)}
        }
        * { -webkit-tap-highlight-color: transparent; }
        button { -webkit-tap-highlight-color: transparent; }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
